<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/signup.css">
    <title>Sign Up</title>
</head>
<body>
    <div class="wrapper">
        <form action="" class="needs-validation" novalidate id="signupForm">
            <h1>Create Account</h1>

            <div class="mb-3 input-box">
                <input type="text" class="form-control" id="fullName" placeholder="Full Name" required>
                <div class="invalid-feedback">Please enter your full name.</div>
            </div>

            <div class="mb-3 input-box">
                <input type="email" class="form-control" id="email" placeholder="Email" required>
                <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>

            <div class="mb-3 input-box">
                <input type="text" class="form-control" id="username" placeholder="Username" required>
                <div class="invalid-feedback">Please choose a username.</div>
            </div>

            <div class="mb-3 input-box">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <div class="invalid-feedback">Password must be at least 6 characters long.</div>
            </div>

            <div class="mb-3 input-box">
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                <div class="invalid-feedback">Passwords do not match.</div>
            </div>

            <div class="d-flex flex-column gap-3">
                <button type="submit" class="btn btn-light w-100">Sign Up</button>
                <button type="button" id="resetBtn" class="btn btn-light w-100">Clear Form</button>
            </div>

            <p id="error-message" class="mt-3"></p>

            <div class="already-registered mt-3">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/signup.js"></script>
</body>
</html>
